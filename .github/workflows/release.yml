name: Release Windows App

# Pushing a tag "v1.2.3" builds the Windows installer and the portable ZIP
# and publishes them as a GitHub release with the version history since the
# previous tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: vars
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $installerName = "SIPFunk-$version-win-x64.exe"
          $zipName = "SIPFunk-$version-win-x64.zip"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer_name=$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer_path=release/$installerName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_path=release/$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Find previous release tag
        id: prev_tag
        shell: pwsh
        run: |
          $tags = @(git tag --sort=-v:refname)
          $current = "${{ github.ref_name }}"
          $currentIndex = [Array]::IndexOf($tags, $current)
          $previousTag = ''
          if ($currentIndex -ge 0 -and ($currentIndex + 1) -lt $tags.Count) {
            $previousTag = $tags[$currentIndex + 1]
          }
          Write-Host "Current tag: $current"
          Write-Host "Previous tag: $previousTag"
          "previous_tag=$previousTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Collect commit log between tags
        id: commit_log
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $previousTag = "${{ steps.prev_tag.outputs.previous_tag }}"
          $current = "${{ github.ref_name }}"
          $range = if ($previousTag) { "$previousTag..$current" } else { "$current" }
          Write-Host "Commit range: $range"
          $commits = git log $range --no-merges --pretty=format:"- %s (%h)"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $commitLines = @($commits -split "`n" | Where-Object { $_.Trim() -ne '' })
          if ($commitLines.Count -eq 0) {
            Set-Content -Path release/commit-log.txt -Value "No commits were found in range $range." -Encoding utf8
          } else {
            Set-Content -Path release/commit-log.txt -Value $commitLines -Encoding utf8
          }
          "commit_count=$($commitLines.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        shell: pwsh
        run: npm version "${{ steps.vars.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The built-in app registrations for the one-click contact import (Google and
      # Microsoft) come from the OAUTH_CLIENTS_JSON secret, the content of
      # oauth-clients.json. Without it the app asks users to set up their own app.
      - name: Write built-in OAuth clients
        shell: pwsh
        env:
          OAUTH_CLIENTS_JSON: ${{ secrets.OAUTH_CLIENTS_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OAUTH_CLIENTS_JSON)) {
            Write-Host "::notice title=No built-in OAuth clients::OAUTH_CLIENTS_JSON secret is not set; the contact import needs the user's own app registration."
          } else {
            $null = $env:OAUTH_CLIENTS_JSON | ConvertFrom-Json
            [System.IO.File]::WriteAllText("oauth-clients.json", $env:OAUTH_CLIENTS_JSON)
          }

      - name: Build Windows installer and portable ZIP
        run: npm run dist:win

      # The changelog is written by GitHub Copilot CLI from the commit subjects.
      # It needs a fine-grained PAT with the "Copilot Requests" permission in
      # the COPILOT_GITHUB_TOKEN secret; without it the release falls back to
      # the section of this version in CHANGELOG.md, or to GitHub's generated
      # notes if there is none.
      - name: Check Copilot token
        id: copilot_token
        shell: pwsh
        env:
          HAS_COPILOT_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN != '' }}
        run: |
          "available=$env:HAS_COPILOT_TOKEN" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:HAS_COPILOT_TOKEN -ne 'true') {
            Write-Host "::notice title=AI changelog skipped::COPILOT_GITHUB_TOKEN secret is not set; using the CHANGELOG.md section of this version, or GitHub auto-generated notes if there is none."
          }

      - name: Generate AI changelog
        id: ai_changelog
        if: steps.commit_log.outputs.commit_count != '0' && steps.copilot_token.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()

          npm install -g @github/copilot
          if ($LASTEXITCODE -ne 0) { throw "Copilot CLI install failed with exit code $LASTEXITCODE." }
          # Run the loader through node.exe: the npm .cmd shim cannot pass a multi-line prompt argument.
          $loader = Join-Path (npm root -g) '@github/copilot/npm-loader.js'

          $instructions = @'
          You are a precise release-notes writer for SIPFunk, a local AI phone
          assistant for Windows: a SIP client for a FRITZ!Box that connects calls
          to the OpenAI Realtime API or the Google Gemini Live API (outgoing
          calls, answering machine, spam defence), with a tray app and a local
          web UI.

          You will receive a list of git commit subjects, one per line, each formatted
          as "- subject (short-hash)". The subjects are written in German. Turn that
          list into a concise, user-facing changelog in English Markdown. Do not use
          any tools; answer from the list alone.

          Rules:
          - Group entries under "### Added", "### Changed", "### Fixed", and
            "### Removed" headings, but only include a heading if it has at least
            one entry.
          - Summarize related or duplicate commits into a single bullet instead of
            listing every commit separately.
          - Skip routine chores that are not user-relevant, such as version bumps,
            formatting-only changes, or CI-only tweaks, unless nothing else is
            available.
          - Do not include commit hashes or author names in the output.
          - Do not invent features or fixes that are not implied by the commit
            subjects.
          - Keep bullets short, factual, and written for an end user, not a
            developer.
          - Respond with Markdown only, no surrounding commentary.
          '@
          $commits = Get-Content -Raw -Encoding utf8 -Path release/commit-log.txt
          $prompt = "$instructions`nCommit subjects:`n$commits"

          # Run from an empty directory so the agent sees no repository files or instructions.
          $work = Join-Path $env:RUNNER_TEMP 'copilot-changelog'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Push-Location $work
          try {
            $output = & node $loader -p $prompt -s --no-ask-user --no-color --stream off --no-auto-update --no-custom-instructions --disable-builtin-mcps --secret-env-vars COPILOT_GITHUB_TOKEN
            $exitCode = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($exitCode -ne 0) { throw "Copilot CLI exited with code $exitCode." }

          $response = (@($output) -join "`n").Trim()
          if (-not $response) { throw 'Copilot CLI returned an empty changelog.' }

          $delimiter = "AI_CHANGELOG_$([guid]::NewGuid().ToString('N'))"
          "response<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $response | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate release description
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.version }}
          RELEASE_INSTALLER_NAME: ${{ steps.vars.outputs.installer_name }}
          RELEASE_ZIP_NAME: ${{ steps.vars.outputs.zip_name }}
          PREVIOUS_TAG: ${{ steps.prev_tag.outputs.previous_tag }}
          AI_CHANGELOG: ${{ steps.ai_changelog.outputs.response }}
          AI_CHANGELOG_OUTCOME: ${{ steps.ai_changelog.outcome }}
          COPILOT_TOKEN_AVAILABLE: ${{ steps.copilot_token.outputs.available }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tagName = context.ref.replace('refs/tags/', '');
            const version = process.env.RELEASE_VERSION || tagName.replace(/^v/, '');
            const installerName = process.env.RELEASE_INSTALLER_NAME;
            const zipName = process.env.RELEASE_ZIP_NAME;
            const previousTag = String(process.env.PREVIOUS_TAG || '').trim();
            const aiChangelog = String(process.env.AI_CHANGELOG || '').trim();
            const aiSucceeded = process.env.AI_CHANGELOG_OUTCOME === 'success' && aiChangelog.length > 0;

            // The section of this version in CHANGELOG.md, if it has one
            const ownSection = (() => {
              const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
              const start = lines.findIndex((l) => l.startsWith(`## ${version} `) || l.trim() === `## ${version}`);
              if (start < 0) return '';
              const rest = lines.slice(start + 1);
              const end = rest.findIndex((l) => l.startsWith('## '));
              return (end < 0 ? rest : rest.slice(0, end)).join('\n').trim();
            })();

            let changelog;
            let changelogSource;
            if (aiSucceeded) {
              changelog = aiChangelog;
              changelogSource = 'AI-generated summary by GitHub Copilot';
            } else if (ownSection) {
              changelog = ownSection;
              changelogSource = 'from CHANGELOG.md';
            } else {
              const notes = await github.rest.repos.generateReleaseNotes({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: context.sha,
                previous_tag_name: previousTag || undefined,
              });
              const generatedBody = String(notes.data.body || '').trim();
              changelog = generatedBody || 'No changelog entries were generated for this tag.';
              const fallbackReason = process.env.COPILOT_TOKEN_AVAILABLE !== 'true'
                ? 'COPILOT_GITHUB_TOKEN is not configured'
                : process.env.AI_CHANGELOG_OUTCOME === 'skipped'
                  ? 'no commits since the previous tag'
                  : 'the AI changelog step failed';
              changelogSource = `GitHub auto-generated notes; ${fallbackReason}`;
            }

            const commitLog = fs.readFileSync(path.join('release', 'commit-log.txt'), 'utf8').replace(/^﻿/, '').trim();
            const range = previousTag ? `${previousTag} → ${tagName}` : `up to ${tagName}`;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${tagName}`;

            const body = [
              `# SIPFunk ${tagName}`,
              '',
              'Local AI phone assistant for Windows: a SIP client for a FRITZ!Box that connects calls to the OpenAI Realtime API or the Google Gemini Live API (outgoing calls, answering machine, spam defence).',
              '',
              '## Downloads',
              '',
              `- Windows installer: \`${installerName}\` (per user, no administrator rights; SIPFunk then starts after you sign in to Windows, which you can switch off in the tray menu)`,
              `- Portable ZIP: \`${zipName}\` (unpack and start \`SIPFunk.exe\`; no autostart unless you switch it on)`,
              '',
              'The files are not code-signed, so Windows SmartScreen warns on first start: "More info" → "Run anyway".',
              `Read the [legal notes](${base}/doc/legal.md) before use; you run SIPFunk at your own risk. Setup: [user guide](${base}/doc/user-guide.md) · [Benutzerhandbuch](${base}/doc/user-guide.de.md).`,
              '',
              '## Validation',
              '',
              'This release was built by GitHub Actions after the type check, the tests and Windows packaging completed successfully.',
              '',
              `## Changelog (${changelogSource})`,
              '',
              changelog,
              '',
              `Details per version: [CHANGELOG.md](${base}/CHANGELOG.md) · [CHANGELOG.de.md](${base}/CHANGELOG.de.md).`,
              '',
              '<details>',
              `<summary>Version history: commits ${range}</summary>`,
              '',
              commitLog,
              '',
              '</details>',
              '',
            ].join('\n');

            fs.writeFileSync(path.join('release', 'release-notes.md'), body);

      - name: Remove previous build assets for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $releaseJson = gh release view $tag --repo $repo --json assets 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseJson)) {
            Write-Host "No existing release assets to remove for $tag."
            exit 0
          }
          $release = $releaseJson | ConvertFrom-Json
          foreach ($asset in $release.assets) {
            if ($asset.name -match '^SIPFunk-.+-win-x64\.(exe|zip)$') {
              Write-Host "Removing old release asset $($asset.name)"
              gh release delete-asset $tag $asset.name --repo $repo --yes
            }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release/release-notes.md
          fail_on_unmatched_files: true
          files: |
            ${{ steps.vars.outputs.installer_path }}
            ${{ steps.vars.outputs.zip_path }}
