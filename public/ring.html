<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIPFunk – eingehender Anruf</title>
<script src="/i18n-en.js"></script>
<script src="/i18n.js"></script>
<style>
  /* Pop-up der Tray-App beim Klingeln. Dieselben Farben wie die Web-UI, hell und dunkel. */
  /* Kontraste wie in index.html berechnet; neu: Text auf dem roten Knopf im Dunkeln 6.0:1 (vorher Weiß auf #ff5c5c 3.0:1) */
  :root { --bg: #ffffff; --surface-2: #f0f0f3; --line: #d9d9de; --control: #86868b; --text: #1d1d1f; --text-2: #66666b; --accent: #0066cc; --accent-text: #fff; --danger: #d70015; --danger-text: #fff; --ok: #17602d; --warn: #734400; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1f22; --surface-2: #2a2a2e; --line: #3a3a3f; --control: #7d7d85; --text: #f2f2f4; --text-2: #a6a6ad; --accent: #4c9eff; --accent-text: #0b1a2b; --danger: #ff5c5c; --danger-text: #2b0a0a; --ok: #4cd472; --warn: #ffc24d; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; border: 1px solid var(--line); overflow: hidden; -webkit-app-region: drag; user-select: none; }
  .wrap { padding: 14px 16px 12px; display: grid; gap: 8px; height: 100%; grid-template-rows: auto auto 1fr auto; }
  .top { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .top .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .top .dot { animation: none; } }
  .top .x { margin-left: auto; border: 0; background: transparent; color: var(--text-2); font-size: 16px; cursor: pointer; min-width: 28px; min-height: 28px; border-radius: 6px; -webkit-app-region: no-drag; }
  .top .x:hover { background: var(--surface-2); color: var(--text); }
  .top .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .who { font-size: 19px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verdict { border-radius: 8px; padding: 8px 10px; background: var(--surface-2); border-left: 3px solid var(--text-2); font-size: 13px; align-self: start; }
  .verdict b { display: block; }
  .verdict span { color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .verdict[data-l="spam"] { border-left-color: var(--danger); }
  .verdict[data-l="spam"] b { color: var(--danger); }
  .verdict[data-l="suspicious"] { border-left-color: var(--warn); }
  .verdict[data-l="suspicious"] b { color: var(--warn); }
  .verdict[data-l="contact"], .verdict[data-l="ok"] { border-left-color: var(--ok); }
  .verdict[data-l="contact"] b, .verdict[data-l="ok"] b { color: var(--ok); }
  .btns { display: flex; gap: 8px; flex-wrap: nowrap; -webkit-app-region: no-drag; }
  button.b { flex: 1 1 auto; white-space: nowrap; font-size: 13px; border: 1px solid var(--control); border-radius: 8px; padding: 6px 10px; min-height: 32px; background: transparent; color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
  button.b:hover { background: var(--surface-2); }
  button.b:disabled { opacity: .45; cursor: default; }
  button.b.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
  button.b.trap { background: var(--danger); color: var(--danger-text); border-color: transparent; font-weight: 600; }
  button.b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { color: var(--text-2); font-size: 12px; min-height: 16px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="dot"></span><span id="head">Eingehender Anruf</span><button class="x" id="close" aria-label="Fenster schließen" title="Schließen (der Anruf läuft weiter)">✕</button></div>
  <div>
    <div class="who" id="who" data-no-i18n>…</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="verdict" id="verdict" data-l="unknown" role="status"><b id="v-label">Prüfe Nummer …</b><span id="v-detail"></span></div>
  <div>
    <div class="btns">
      <button class="b trap" id="trap">In die Spam-Falle</button>
      <button class="b" id="answer">KI jetzt annehmen</button>
      <button class="b" id="skip">Klingeln lassen</button>
    </div>
    <div class="note" id="note" role="status"></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let done = false;
async function post(path) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function render(r) {
  $('who').textContent = r.callerName || r.caller || 'Nummer unterdrückt';
  $('sub').textContent = [r.callerName ? r.caller : '', r.line ? `für ${r.line}` : ''].filter(Boolean).join(' · ');
  $('verdict').dataset.l = r.verdict.level;
  $('v-label').textContent = r.verdict.label;
  $('v-detail').textContent = r.verdict.detail;
  const secs = r.answerAt ? Math.max(0, Math.ceil((r.answerAt - Date.now()) / 1000)) : 0;
  if (!done) $('note').textContent = r.willAnswer ? I18N.t('Die KI nimmt in {0} s als Assistent an.', secs) : 'Die KI nimmt diesen Anruf nicht an; er klingelt nur.';
  $('trap').disabled = done || !r.canTrap;
  $('trap').title = r.canTrap ? 'Sofort annehmen; die KI tritt als Privatperson auf und wimmelt ab oder hält hin' : (r.trapHint || '');
  if (!r.canTrap && r.trapHint && !done) $('note').textContent += ' ' + r.trapHint + '.';
  $('answer').disabled = done;
  $('skip').disabled = done || !r.willAnswer;
  // Bei Spam-Verdacht ist die Spam-Falle der naheliegende Knopf, sonst das normale Annehmen
  const hot = r.verdict.level === 'spam' || r.verdict.level === 'suspicious';
  $('trap').classList.toggle('trap', hot);
  $('answer').classList.toggle('primary', !hot);
}
async function poll() {
  try {
    const r = await (await fetch('/api/ring')).json();
    if (!r.ringing) { window.close(); return; }
    render(r);
  } catch { /* Server kurz weg: weiter versuchen */ }
  setTimeout(poll, 700);
}
async function act(mode, text) {
  done = true;
  for (const id of ['trap', 'answer', 'skip']) $(id).disabled = true;
  $('note').textContent = text;
  try { await post('/api/ring/' + mode); if (mode !== 'skip') setTimeout(() => window.close(), 900); else done = false; }
  catch (err) { done = false; $('note').textContent = err.message; }
}
$('trap').onclick = () => act('trap', 'Leite in die Spam-Falle um …');
$('answer').onclick = () => act('answer', 'Die KI nimmt an …');
$('skip').onclick = () => act('skip', 'Die KI nimmt diesen Anruf nicht an.');
$('close').onclick = () => window.close();
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') window.close(); });
// ?preview zeigt das Fenster ohne klingelnden Anruf (zum Ansehen des Layouts); sonst Zustand abfragen
if (!new URLSearchParams(location.search).has('preview')) {
  poll();
  // Sprache aus den Einstellungen übernehmen (lädt das Fenster neu, falls sie von der zuletzt benutzten abweicht)
  fetch('/api/settings').then((r) => r.json()).then((s) => I18N.sync(s.uiLang)).catch(() => {});
}
</script>
</body>
</html>
